<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’argumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d1c; --bg2:#0f1730; --bg3:#17224a; --card:#111a38;
  --accent:#a78bfa; --accent2:#c084fc; --orange:#f59e0b;
  --text:#eef2ff; --text2:#b6c0e2; --text3:#7884ad;
  --border:#243063; --radius:16px; --success:#34d399; --error:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 45%),
                   radial-gradient(circle at 92% 0%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 40%);
  background-attachment:fixed;
}
.mono{font-family:'Space Mono',monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(8,13,28,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hbar{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hname{font-weight:800;font-size:1rem;letter-spacing:-.01em;flex:1;min-width:120px}
.hname small{display:block;font-weight:400;font-size:.72rem;color:var(--text3);letter-spacing:0}
.chip{font-family:'Space Mono',monospace;font-size:.75rem;background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip b{color:var(--accent)}
.bar{height:5px;background:var(--bg3)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s ease;border-radius:0 4px 4px 0}

/* ---------- Blocs ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;line-height:1.15}
h2{font-size:1.25rem;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700;margin:14px 0 6px;color:var(--accent)}
p{color:var(--text2);margin-bottom:10px}
ul,ol{color:var(--text2);margin:0 0 10px 20px}
li{margin-bottom:5px}
b,strong{color:var(--text);font-weight:700}
.lead{font-size:1.02rem;color:var(--text2)}
.eyebrow{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--accent)}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;color:var(--text2)}
th{background:var(--bg3);color:var(--text);font-weight:600}

/* ---------- Boutons ---------- */
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:12px;transition:transform .12s ease,filter .15s ease}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06101f;border:none;padding:13px 22px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.wide{display:block;width:100%;margin-top:12px}
.btn.sm{padding:9px 14px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---------- Hub ---------- */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.lvl{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:16px;text-align:left;color:var(--text);width:100%}
.lvl:hover{border-color:var(--accent);filter:brightness(1.08)}
.lvl.lock{opacity:.5;border-left-color:var(--text3);cursor:not-allowed}
.lvl .n{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--text3)}
.lvl .t{font-weight:700;margin:3px 0 4px}
.lvl .o{font-size:.85rem;color:var(--text2)}
.lvl .stars{margin-top:8px;font-size:.95rem;letter-spacing:2px}

/* ---------- Questions ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--text3)}
.enonce{font-size:1.08rem;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
.texte-source{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:10px;padding:14px;margin-bottom:14px;color:var(--text2);font-size:.95rem;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:13px 15px;margin-bottom:9px;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--bg3)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--bg3)}
.opt.good{border-color:var(--success);background:color-mix(in srgb,var(--success) 16%,var(--bg2))}
.opt.bad{border-color:var(--error);background:color-mix(in srgb,var(--error) 14%,var(--bg2))}
.opt .mk{float:right;font-weight:700}
input[type=text]{width:100%;font-family:'Space Mono',monospace;font-size:1.05rem;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:12px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:170px;font-family:'Outfit',sans-serif;font-size:1rem;line-height:1.6;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.calc{font-family:'Space Mono',monospace;font-size:.85rem;color:var(--accent);min-height:20px;margin-top:6px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:44px;padding:8px;background:var(--bg2);border:1px dashed var(--border);border-radius:12px}
.slot{background:var(--bg3);border:1px solid var(--accent);border-radius:9px;padding:6px 10px;font-size:.9rem}
.slot i{font-family:'Space Mono',monospace;font-style:normal;color:var(--accent);margin-right:6px}
.tok{display:inline-block;padding:3px 5px;margin:1px;border-radius:6px;border:1px dashed transparent;cursor:pointer;font-size:1rem}
.tok:hover{background:var(--bg3)}
.tok.flag{background:color-mix(in srgb,var(--orange) 28%,var(--bg2));border-color:var(--orange)}
.tok.ok{background:color-mix(in srgb,var(--success) 22%,var(--bg2));border-color:var(--success)}
.tok.miss{background:color-mix(in srgb,var(--error) 22%,var(--bg2));border-color:var(--error)}
.zone-tok{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;line-height:2.1;margin-bottom:12px}

/* ---------- Feedback ---------- */
.fb{border-radius:12px;padding:14px;margin-top:14px;border:1px solid var(--border);background:var(--bg2);animation:up .25s ease}
.fb.good{border-color:var(--success)}
.fb.warn{border-color:var(--orange)}
.fb.bad{border-color:var(--error)}
.fb .ttl{font-weight:700;margin-bottom:5px}
.fb.good .ttl{color:var(--success)}
.fb.warn .ttl{color:var(--orange)}
.fb.bad .ttl{color:var(--error)}
.fb p{margin:0;color:var(--text2)}
.fb p+p{margin-top:8px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Bilan ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--text2);margin-bottom:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.medal{font-size:3.4rem;text-align:center;margin:6px 0}
.grade{text-align:center;font-family:'Space Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.center{text-align:center}
.confetti{position:fixed;top:-12px;width:9px;height:16px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.15}}

/* ---------- Divers ---------- */
.note{font-size:.86rem;color:var(--text3);margin-top:10px}
.pred{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pred button{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:9px 13px;font-family:'Space Mono',monospace}
.pred button:hover{border-color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;font-family:'Space Mono',monospace;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:2px 8px;border-radius:999px;margin-left:6px}
@media(max-width:768px){ h1{font-size:1.55rem} .card{padding:16px} .levels{grid-template-columns:1fr} }
@media(max-width:480px){ .wrap{padding:0 11px 60px} .hname{font-size:.92rem} .chip{font-size:.68rem;padding:4px 8px} .enonce{font-size:1rem} .btn{padding:12px 16px} }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="hname">L’argumentation<small>Épreuve écrite · 5 niveaux</small></div>
    <div class="chip">✅ <b id="hScore">0</b></div>
    <div class="chip">🔥 <b id="hStreak">0</b></div>
  </div>
  <div class="bar"><span id="hBar"></span></div>
</header>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   DONNÉES DE L'APPLICATION
   ============================================================ */
const APP = {
titre: "L’argumentation",
intro: "C’est la partie la plus lourde de l’épreuve : il faut d’abord comprendre comment un auteur défend une idée, puis défendre la tienne de la même manière. Cinq niveaux, du vocabulaire de base au texte complet.",

memo: `
<h3>Le vocabulaire, en une ligne chacun</h3>
<table>
<tr><th>Mot</th><th>Sens</th></tr>
<tr><td>Thème</td><td>Le sujet dont on parle</td></tr>
<tr><td>Thèse</td><td>L’opinion défendue</td></tr>
<tr><td>Thèse adverse</td><td>L’opinion combattue</td></tr>
<tr><td>Argument</td><td>La raison qui soutient la thèse</td></tr>
<tr><td>Exemple</td><td>Le cas concret qui illustre l’argument</td></tr>
<tr><td>Concession</td><td>Le point qu’on accorde à l’adversaire avant de le dépasser</td></tr>
<tr><td>Réfutation</td><td>La démonstration que la thèse adverse est fausse</td></tr>
</table>

<h3>Le paragraphe argumentatif, toujours pareil</h3>
<p><b>Connecteur → argument → explication → exemple → mini-conclusion.</b> Un paragraphe = un argument. Si tu as deux idées dans le même paragraphe, coupe-le en deux.</p>

<h3>Les connecteurs à avoir en tête</h3>
<table>
<tr><th>Relation</th><th>Mots</th></tr>
<tr><td>Ajouter</td><td>de plus, en outre, par ailleurs</td></tr>
<tr><td>Opposer</td><td>mais, cependant, toutefois, en revanche</td></tr>
<tr><td>Concéder</td><td>certes… mais, il est vrai que, bien sûr</td></tr>
<tr><td>Causer</td><td>car, parce que, en effet, puisque</td></tr>
<tr><td>Conclure une étape</td><td>donc, ainsi, par conséquent</td></tr>
<tr><td>Illustrer</td><td>par exemple, ainsi, notamment</td></tr>
<tr><td>Renverser</td><td>or</td></tr>
</table>

<h3>Le plan qui marche à tous les coups</h3>
<ol>
<li><b>Introduction</b> — une phrase d’entrée sur le sujet, la question posée, l’annonce de ta position.</li>
<li><b>Concession</b> — ce que tu accordes à l’avis opposé (« Certes… »). Ce paragraphe te fait gagner des points : il montre que tu as vu l’autre côté.</li>
<li><b>Argument 1 + exemple</b></li>
<li><b>Argument 2 + exemple</b></li>
<li><b>Argument 3 + exemple</b> (le plus fort en dernier)</li>
<li><b>Conclusion</b> — bilan de ta démonstration, puis une ouverture ou une question.</li>
</ol>

<h3>Les cinq erreurs les plus fréquentes</h3>
<ul>
<li>Empiler des exemples sans argument : trois anecdotes ne font pas une démonstration.</li>
<li>Oublier d’annoncer sa position dans l’introduction.</li>
<li>Attaquer les personnes plutôt que leurs arguments.</li>
<li>Écrire au registre familier (« les gens galèrent », « c’est nul »).</li>
<li>Une conclusion qui répète l’introduction mot pour mot.</li>
</ul>
`,

atelier: {
  bouton: "Atelier plan",
  titre: "Construis un plan complet en 10 minutes",
  consigne: `<p>Choisis un sujet, remplis les cases, puis compare avec un plan modèle. À l’examen, ce travail se fait au brouillon et te prend un quart d’heure — c’est le quart d’heure qui décide de toute la copie.</p>`,
  monter: function(){
    const sujets = [
      "Faut-il interdire les smartphones dans les écoles secondaires ?",
      "Le télétravail est-il un progrès pour les travailleurs ?",
      "Faut-il rendre le bénévolat obligatoire pour les jeunes ?"
    ];
    const z = document.getElementById('zoneAtelier');
    z.innerHTML = `
      <h3>1. Ton sujet</h3>
      <div id="asuj">${sujets.map((s,i)=>`<button class="opt" id="s${i}">${s}</button>`).join('')}</div>
      <div id="aform"></div>`;
    sujets.forEach((s,i)=>{
      document.getElementById('s'+i).onclick = () => {
        sujets.forEach((_,j)=>document.getElementById('s'+j).classList.toggle('sel', i===j));
        document.getElementById('aform').innerHTML = `
        <h3>2. Ta position, en une phrase</h3>
        <input type="text" placeholder="Je pense que…">
        <h3>3. Ce que tu accordes à l’avis opposé</h3>
        <input type="text" placeholder="Certes…">
        <h3>4. Argument 1 + son exemple</h3>
        <input type="text" placeholder="Argument, puis exemple concret">
        <h3>5. Argument 2 + son exemple</h3>
        <input type="text" placeholder="Argument, puis exemple concret">
        <h3>6. Argument 3, le plus fort</h3>
        <input type="text" placeholder="Argument, puis exemple concret">
        <h3>7. Ton ouverture finale</h3>
        <input type="text" placeholder="Une question ou un élargissement">
        <button class="btn wide" id="amod">Voir un plan modèle sur ce sujet</button>
        <div id="asol"></div>`;
        document.getElementById('amod').onclick = () => {
          document.getElementById('asol').innerHTML = `
          <div class="fb good"><div class="ttl">Un plan possible — ${s}</div>
          <p><b>Position :</b> une interdiction générale traite le symptôme et manque la cause, mais un encadrement strict est nécessaire.</p>
          <p><b>Concession :</b> il est vrai que la présence du téléphone fragmente l’attention et facilite le harcèlement entre élèves.</p>
          <p><b>Argument 1 — l’efficacité :</b> une règle qui ne peut pas être appliquée partout se contourne et perd son autorité ; l’exemple des établissements qui ont dû revenir sur une interdiction totale le montre.</p>
          <p><b>Argument 2 — l’éducation :</b> l’école prépare à une vie où l’outil sera partout ; apprendre à s’en servir vaut mieux que le retirer pendant six heures par jour.</p>
          <p><b>Argument 3 — l’égalité, le plus fort :</b> pour certains élèves, le téléphone est le seul outil numérique disponible à la maison ; l’interdire sans alternative creuse l’écart au lieu de le réduire.</p>
          <p><b>Ouverture :</b> la vraie question n’est peut-être pas l’objet, mais ce que l’école propose à la place de l’attention qu’il capte.</p></div>
          <div class="fb"><div class="ttl">Vérifie ton plan</div>
          <p>Six points : ta position est-elle annoncée clairement ? La concession est-elle sincère, c’est-à-dire réellement gênante pour toi ? Chaque argument est-il différent des autres, et pas la même idée reformulée ? Chaque exemple est-il concret et vérifiable ? Ton argument le plus fort est-il en dernier ? Ton ouverture pose-t-elle une vraie question, plutôt que de répéter l’introduction ?</p></div>`;
        };
      };
    });
  }
},

niveaux: [
{
  titre: "Le vocabulaire de l’argumentation",
  objectif: "Nommer précisément chaque pièce d’un texte qui défend une idée.",
  rappel: `
    <p>Un texte argumentatif est une machine à cinq pièces. Les nommer sert à deux choses : les repérer dans le texte qu’on te donne, et ne pas en oublier dans le texte que tu écris.</p>
    <ul>
      <li>Le <b>thème</b> est le sujet dont on parle. « Le service militaire », par exemple.</li>
      <li>La <b>thèse</b> est ce que l’auteur veut te faire admettre à ce propos.</li>
      <li>Un <b>argument</b> est une raison, une idée générale qui soutient la thèse.</li>
      <li>Un <b>exemple</b> est un cas particulier, concret, qui rend l’argument palpable.</li>
      <li>La <b>thèse adverse</b> est l’opinion contre laquelle l’auteur écrit ; la <b>réfuter</b>, c’est montrer qu’elle ne tient pas.</li>
    </ul>
    <p>Une distinction que les correcteurs regardent de près : <b>convaincre</b> s’adresse à la raison par des arguments, tandis que <b>persuader</b> s’adresse aux émotions par le ton, les images, l’indignation. Les deux sont légitimes, mais une copie qui ne fait que persuader n’a rien démontré.</p>
    <p>Un texte peut enfin <b>délibérer</b> : peser le pour et le contre avant de trancher. C’est souvent la forme la plus solide, à condition de trancher pour de bon à la fin.</p>`,
  questions: [
    { type:"qcm", enonce:"Dans un texte argumentatif, la thèse est :",
      options:["l’opinion que l’auteur défend","le sujet dont le texte parle","le cas concret qui illustre le propos","la première phrase du texte"], correct:0,
      indice:"Le sujet et l’opinion sur ce sujet sont deux choses différentes.",
      solution:"L’opinion que l’auteur défend.",
      explication:"La thèse est une prise de position : on doit pouvoir être d’accord ou non avec elle. « Les transports en commun » n’est pas une thèse, c’est un thème ; « les transports en commun devraient être gratuits » en est une." },

    { type:"qcm", enonce:"« Beaucoup de jeunes trouvent leur premier emploi grâce à un stage : mon voisin a été engagé après le sien. » Dans cette phrase, la mention du voisin est :",
      options:["un exemple qui illustre l’argument","l’argument lui-même","la thèse du texte","une concession faite à l’adversaire"], correct:0,
      indice:"Un cas particulier ne démontre rien à lui seul. Quelle est sa fonction, alors ?",
      solution:"Un exemple qui illustre l’argument.",
      explication:"L’argument est l’idée générale : les stages débouchent souvent sur un emploi. Le voisin n’est qu’un cas concret qui la rend vivante. Beaucoup de copies confondent les deux et enchaînent les histoires personnelles en croyant démontrer — un correcteur y voit au contraire une absence d’argument." },

    { type:"vf", enonce:"« Convaincre » s’adresse à la raison, « persuader » s’adresse aux émotions.", correct:true,
      indice:"Pense à la différence entre une démonstration et un discours qui te touche.",
      explication:"C’est exactement la distinction attendue. Convaincre passe par des arguments et des faits ; persuader passe par le ton, les images, l’émotion. À l’écrit d’examen, on te demande d’abord de convaincre." },

    { type:"qcm", enonce:"Un auteur écrit : « Certes, une taxe sur les emballages coûterait davantage aux ménages modestes. Mais un système de remboursement corrige entièrement cet effet. » La première phrase est :",
      options:["une concession","une réfutation","un exemple","sa thèse"], correct:0,
      indice:"L’auteur commence par donner raison à quelqu’un. Combien de temps ?",
      solution:"Une concession.",
      explication:"Concéder, c’est accorder un point à l’adversaire pour mieux le dépasser ensuite — d’où le « mais » qui suit toujours. C’est une des marques d’une copie mûre : montrer qu’on a vu l’objection est plus fort que faire comme si elle n’existait pas." },

    { type:"qcm", enonce:"Réfuter une thèse adverse, c’est :",
      options:["montrer par un raisonnement qu’elle ne tient pas","la citer avant de passer à autre chose","la reformuler plus clairement que son auteur","affirmer le contraire avec force"], correct:0,
      indice:"Le mot contient l’idée d’un travail à faire, pas seulement d’une opposition à afficher.",
      solution:"Montrer par un raisonnement qu’elle ne tient pas.",
      explication:"Réfuter suppose un travail : on prend l’argument adverse au sérieux et on en montre la faille. Affirmer le contraire plus fort n’est pas une réfutation, c’est un bras de fer — et le correcteur le voit immédiatement." },

    { type:"multi", enonce:"Coche les énoncés qui sont des thèses (des opinions discutables), et pas autre chose.",
      options:["Le permis de conduire devrait être gratuit pour les demandeurs d’emploi.","Le sport à l’école mérite plus d’heures qu’on ne lui en accorde.","La Belgique compte trois régions.","Le film dure deux heures et quart."],
      corrects:[0,1],
      indice:"Une thèse peut être contestée. Un fait vérifiable ne se conteste pas, il se vérifie.",
      socratique:"Demande-toi pour chaque phrase : puis-je être en désaccord avec elle sans être dans l’erreur ?",
      solution:"Les deux énoncés qui prennent position : la gratuité du permis et les heures de sport.",
      explication:"La gratuité du permis et le nombre d’heures de sport sont des prises de position : on peut les contester sans être dans l’erreur. Le nombre de régions belges et la durée d’un film sont des faits vérifiables ; ils peuvent servir d’appui à un raisonnement, mais ils ne se défendent pas. Confondre les deux mène à une copie qui décrit au lieu d’argumenter." },

    { type:"ordre", enonce:"Remets dans l’ordre les cinq éléments d’un paragraphe argumentatif bien construit.",
      melange:["L’exemple concret qui rend l’argument palpable","Le connecteur qui relie au paragraphe précédent","L’argument, énoncé en une phrase claire","La phrase de bilan qui relie l’argument à la thèse","L’explication : pourquoi cet argument tient"],
      rang:[3,0,1,4,2],

{

  objectif: "Reconnaître un argument, sa nature, et savoir quand il est truqué.",
  rappel: `
    <p>Tous les arguments ne se ressemblent pas, et savoir les nommer aide autant à analyser un texte qu’à varier les siens.</p>
    <ul>
      <li><b>Argument logique</b> — un enchaînement de causes et de conséquences. Si A, alors B.</li>
      <li><b>Argument d’autorité</b> — on s’appuie sur une source reconnue : une étude, un spécialiste, une institution.</li>
      <li><b>Argument par analogie</b> — on compare la situation à une autre, mieux connue, pour l’éclairer.</li>
      <li><b>Argument de valeur</b> — on invoque un principe : la justice, la liberté, l’égalité, la dignité.</li>
      <li><b>Argument par l’expérience</b> — on s’appuie sur des faits observés, des chiffres, du vécu.</li>
    </ul>
    <p>Certains raisonnements ont l’air d’arguments sans en être. Les deux plus fréquents : la <b>généralisation hâtive</b>, qui tire une règle d’un ou deux cas, et l’<b>attaque de la personne</b>, qui vise celui qui parle plutôt que ce qu’il dit. Les repérer chez l’adversaire est une force ; les éviter chez soi est une nécessité.</p>`,

{

  objectif: "Rendre visible le raisonnement grâce aux mots de liaison.",
  rappel: `
    <p>Les connecteurs sont les panneaux de signalisation de ton texte. Un correcteur qui ne les trouve pas doit deviner ton raisonnement — et il ne devine pas, il enlève des points.</p>
    <table>
      <tr><th>Relation</th><th>Exemples</th></tr>
      <tr><td>Ajouter une idée</td><td>de plus, en outre, par ailleurs</td></tr>
      <tr><td>Opposer</td><td>mais, cependant, toutefois, en revanche</td></tr>
      <tr><td>Donner la cause</td><td>car, parce que, en effet, puisque</td></tr>
      <tr><td>Donner la conséquence</td><td>donc, ainsi, par conséquent, c’est pourquoi</td></tr>
      <tr><td>Illustrer</td><td>par exemple, notamment, en particulier</td></tr>
      <tr><td>Conclure</td><td>en définitive, pour finir, en somme</td></tr>
    </table>
    <p>Deux pièges classiques. D’abord la <b>cause et la conséquence se confondent</b> facilement : « il pleut, donc la route est mouillée » ne dit pas la même chose que « la route est mouillée, car il pleut », même si les deux phrases sont vraies. Ensuite, on <b>répète le même connecteur</b> : trois « de plus » à la suite donnent une liste, pas une démonstration.</p>`,

{

    <p>Analyser un texte, c’est répondre dans l’ordre à cinq questions, toujours les mêmes.</p>
    <ol>
      <li><b>De quoi parle-t-il ?</b> Le thème.</li>
      <li><b>Que veut-il me faire admettre ?</b> La thèse.</li>
      <li><b>Contre qui écrit-il ?</b> La thèse adverse, souvent citée dès les premières lignes.</li>
      <li><b>Comment s’y prend-il ?</b> Les arguments et leur type.</li>
      <li><b>Avec quel ton ?</b> Neutre, indigné, ironique.</li>
    </ol>
    <p>Deux procédés à savoir nommer, parce qu’ils reviennent sans cesse. La <b>question rhétorique</b> est une question dont la réponse est imposée par la façon dont elle est posée : elle fait participer le lecteur sans lui laisser le choix. L’<b>ironie</b> consiste à dire le contraire de ce qu’on pense, pour que le lecteur rétablisse lui-même le vrai sens ; c’est efficace, mais dangereux dans une copie, car une ironie mal signalée se lit au premier degré.</p>`,

    <p>Le <b>développement</b> avance par paragraphes, un argument chacun, du plus faible au plus fort. Le lecteur doit sentir que ça monte.</p>
    <p>La <b>conclusion</b> fait le bilan de ce que tu as démontré, sans introduire d’argument neuf, puis ouvre sur une question plus large.</p>
    <p>Un mot sur le <b>registre</b> : l’écrit d’examen se rédige en langue courante ou soutenue. On écrit « de nombreux jeunes rencontrent des difficultés », pas « les jeunes galèrent grave ». Ce n’est pas une question de politesse, c’est un critère de correction.</p>`,

/* ============================================================
   Rotation déterministe des propositions (convention 3.7)
   La bonne réponse est rédigée en position 0 puis déplacée,
   afin qu'elle ne soit jamais toujours au même endroit.
   ============================================================ */
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if(!q.options || q.options.length < 3) return;
    if(q.type === 'qcm'){
      const t = DECALAGE[k++ % DECALAGE.length];
      for(let n = 0; n < t; n++){
        q.options.unshift(q.options.pop());
        q.correct = (q.correct + 1) % q.options.length;
      }
    } else if(q.type === 'multi'){
      const t = DECALAGE[k++ % DECALAGE.length];
      for(let n = 0; n < t; n++){
        q.options.unshift(q.options.pop());
        q.corrects = q.corrects.map(c => (c + 1) % q.options.length);
      }
    }
  });
})(APP.niveaux.flatMap(n => n.questions));

/* ============================================================
   État (aucune donnée n'est enregistrée ni envoyée : outil autonome)
   ============================================================ */
const S = { ecran:'accueil', niv:0, iq:0, essais:0, indice:false, sel:null,
            multi:[], ordre:[], flags:[], streak:0, total:0, res:{}, pred:{}, debloque:0 };

const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nbQ = i => APP.niveaux[i].questions.length;
const totalQ = APP.niveaux.reduce((a,n)=>a+n.questions.length,0);

function normalise(s){
  return String(s).toLowerCase().trim().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.;:!?]+$/,'');
}
function sansAccents(s){ return normalise(s).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function majHeader(){
  let ok1 = 0;
  Object.values(S.res).forEach(r => r.statuts.forEach(s => { if(s === 'ok1') ok1++; }));
  $('hScore').textContent = ok1;
  $('hStreak').textContent = S.streak;
  let faits = 0;
  Object.values(S.res).forEach(r => faits += r.statuts.filter(Boolean).length);
  $('hBar').style.width = Math.round(faits / totalQ * 100) + '%';
}

   Écran d'accueil
   ============================================================ */

/* ============================================================
   Hub — sélection des niveaux
   ============================================================ */
function etoiles(i){
  const r = S.res[i]; if(!r || r.statuts.filter(Boolean).length < nbQ(i)) return '';
  const p = r.statuts.filter(s=>s==='ok1').length / nbQ(i) * 100;
  const n = p>=85?3:p>=65?2:p>=45?1:0;
  return '<div class="stars">' + '★'.repeat(n) + '<span style="color:var(--text3)">' + '☆'.repeat(3-n) + '</span></div>';
}
function hub(){
  const tousFinis = APP.niveaux.every((_,i)=> S.res[i] && S.res[i].statuts.filter(Boolean).length === nbQ(i));
  app.innerHTML = `
  <div class="card">
    <h2>Choisis ton niveau</h2>
    <p>Les niveaux vont du plus simple au plus proche de l'examen. Il faut <b>80 % de réussite du premier coup</b> pour ouvrir le suivant.</p>
    <div class="levels">
      ${APP.niveaux.map((n,i)=>{
        const lock = i > S.debloque;
        return `<button class="lvl ${lock?'lock':''}" ${lock?'disabled':''} onclick="ouvrirNiveau(${i})">
          <div class="n">NIVEAU ${i+1}${lock?' 🔒':''}</div>
          <div class="t">${n.titre}</div>
          <div class="o">${n.objectif}</div>
          ${etoiles(i)}
        </button>`;
      }).join('')}
    </div>
    <div class="row">
      <button class="btn ghost sm" onclick="memo()">📄 Fiche mémo</button>
      ${APP.atelier ? `<button class="btn ghost sm" onclick="atelier()">✍️ ${APP.atelier.bouton}</button>` : ''}
      ${tousFinis ? `<button class="btn sm" onclick="bilanFinal()">🏁 Bilan complet</button>` : ''}
    </div>
  </div>`;
  majHeader();
}

/* ============================================================
   Niveau : rappel théorique -> prédiction -> questions
   ============================================================ */
function ouvrirNiveau(i){
  S.niv = i; S.iq = 0;
  if(!S.res[i]) S.res[i] = { statuts:new Array(nbQ(i)).fill(null) };
  else S.res[i].statuts = new Array(nbQ(i)).fill(null);
  const n = APP.niveaux[i];
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">NIVEAU ${i+1} — RAPPEL</div>
    <h2>${n.titre}</h2>
    <p><b>Objectif :</b> ${n.objectif}</p>
    <hr>
    ${n.rappel}
    <hr>
    <p><b>Avant de commencer :</b> sur les ${nbQ(i)} questions, combien penses-tu réussir du premier coup ?</p>
    <div class="pred">${Array.from({length:nbQ(i)+1},(_,k)=>`<button onclick="lancer(${i},${k})">${k}</button>`).join('')}</div>
    <p class="note">Prédire son score aide à se rendre compte de ce qu'on maîtrise vraiment. Aucune mauvaise réponse ici.</p>
    <button class="btn ghost sm wide" onclick="hub()">← Retour aux niveaux</button>
  </div>`;
  window.scrollTo(0,0);
}
function lancer(i,p){ S.pred[i] = p; S.iq = 0; question(); }

/* ============================================================
   Affichage d'une question
   ============================================================ */
function question(){
  const n = APP.niveaux[S.niv], q = n.questions[S.iq];
  S.essais = 0; S.indice = false; S.sel = null; S.multi = []; S.ordre = []; S.flags = [];
  let corps = '';

  if(q.type === 'qcm' || q.type === 'vf'){
    const opts = q.type === 'vf' ? ['Vrai','Faux'] : q.options;
    corps = opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="repQcm(${k})">${o}</button>`).join('');
  }
  else if(q.type === 'multi'){
    corps = q.options.map((o,k)=>`<button class="opt" id="o${k}" onclick="togMulti(${k})">☐ ${o}</button>`).join('')
      + `<button class="btn wide" id="valider" onclick="repMulti()">Vérifier</button>`;
  }
  else if(q.type === 'ordre'){
    corps = `<div class="slots" id="slots"><span style="color:var(--text3);font-size:.9rem">Clique les étapes dans le bon ordre…</span></div>`
      + q.melange.map((o,k)=>`<button class="opt" id="o${k}" onclick="togOrdre(${k})">${o}</button>`).join('')
      + `<div class="row"><button class="btn" id="valider" onclick="repOrdre()">Vérifier</button>
         <button class="btn ghost" onclick="resetOrdre()">↺ Recommencer</button></div>`;
  }
  else if(q.type === 'saisie'){
    corps = `<input type="text" id="rep" placeholder="${q.placeholder||'Ta réponse…'}" autocomplete="off"
             onkeydown="if(event.key==='Enter')repSaisie()">
             <button class="btn wide" id="valider" onclick="repSaisie()">Vérifier</button>`;
  }
  else if(q.type === 'nombre'){
    corps = `<input type="text" id="rep" placeholder="${q.placeholder||'Un nombre…'}" autocomplete="off"
             oninput="apercu()" onkeydown="if(event.key==='Enter')repNombre()">
             <div class="calc" id="calc"></div>
             <button class="btn wide" id="valider" onclick="repNombre()">Vérifier</button>
             <p class="note">Tu peux taper un calcul (ex. <span class="mono">640/4</span>) : le résultat s'affiche avant que tu valides.</p>`;
  }
  else if(q.type === 'chasse'){
    corps = `<div class="zone-tok" id="zone">${q.mots.map((m,k)=>
        /^[.,;:!?»«()]$/.test(m) ? `<span>${esc(m)}</span>`
        : `<span class="tok" id="t${k}" onclick="togFlag(${k})">${esc(m)}</span>`).join(' ')}</div>
      <button class="btn wide" id="valider" onclick="repChasse()">Vérifier</button>`;
  }

  app.innerHTML = `
  <div class="card">
    <div class="qhead">
      <span>NIVEAU ${S.niv+1} · QUESTION ${S.iq+1}/${nbQ(S.niv)}</span>
      <span>${q.revision ? '<span class="tag">révision</span>' : ''}</span>
    </div>
    ${q.source ? `<div class="texte-source">${q.source}</div>` : ''}
    <div class="enonce">${q.enonce}</div>
    <div id="zoneRep">${corps}</div>
    ${q.indice ? `<button class="btn ghost sm" id="btnIndice" onclick="voirIndice()" style="margin-top:12px">💡 Un indice</button>` : ''}
    <div id="fb"></div>
  </div>`;
  window.scrollTo(0,0);
  majHeader();
}

function voirIndice(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  S.indice = true;
  const b = $('btnIndice'); if(b) b.style.display = 'none';
  $('fb').innerHTML = `<div class="fb warn"><div class="ttl">💡 Indice</div><p>${q.indice}</p></div>`;
}
function apercu(){
  const v = $('rep').value;
  const c = $('calc');
  if(/[+\-*/×÷]/.test(v) && /^[0-9+\-*/×÷().,\s]+$/.test(v)){
    try{
      const expr = v.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
      const r = Function('"use strict";return (' + expr + ')')();
      c.textContent = isFinite(r) ? v + '  →  = ' + (Math.round(r*100)/100).toString().replace('.',',') : '';
    }catch(e){ c.textContent=''; }
  } else c.textContent = '';
}

/* ---------- Interactions ---------- */
function togMulti(k){
  const i = S.multi.indexOf(k);
  if(i>=0) S.multi.splice(i,1); else S.multi.push(k);
  const b = $('o'+k);
  b.classList.toggle('sel');
  b.innerHTML = (S.multi.includes(k) ? '☑ ' : '☐ ') + APP.niveaux[S.niv].questions[S.iq].options[k];
}
function togOrdre(k){
  if(S.ordre.includes(k)) return;
  S.ordre.push(k);
  $('o'+k).classList.add('sel'); $('o'+k).disabled = true;
  const q = APP.niveaux[S.niv].questions[S.iq];
  $('slots').innerHTML = S.ordre.map((idx,p)=>`<span class="slot"><i>${p+1}</i>${q.melange[idx]}</span>`).join('');
}
function resetOrdre(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  S.ordre = [];
  q.melange.forEach((_,k)=>{ const b=$('o'+k); if(b){ b.classList.remove('sel'); b.disabled=false; } });
  $('slots').innerHTML = '<span style="color:var(--text3);font-size:.9rem">Clique les étapes dans le bon ordre…</span>';
  $('fb').innerHTML = '';
}
function togFlag(k){
  const i = S.flags.indexOf(k);
  if(i>=0) S.flags.splice(i,1); else S.flags.push(k);
  $('t'+k).classList.toggle('flag');
}

/* ---------- Vérifications ---------- */
function repQcm(k){
  const q = APP.niveaux[S.niv].questions[S.iq];
  const bon = q.type === 'vf' ? (q.correct ? 0 : 1) : q.correct;
  const opts = q.type === 'vf' ? ['Vrai','Faux'] : q.options;
  opts.forEach((_,j)=>{ const b=$('o'+j); b.disabled=true;
    if(j===bon) b.classList.add('good');
    if(j===k && k!==bon) b.classList.add('bad');
    if(j===bon) b.innerHTML += '<span class="mk">✓</span>';
  });
  fin(k===bon ? (S.indice?'ok2':'ok1') : 'vu', k===bon);
}
function repMulti(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  const bon = q.corrects.slice().sort().join(',');
  const mien = S.multi.slice().sort().join(',');
  if(mien === bon){
    q.options.forEach((_,j)=>{ $('o'+j).disabled=true; if(q.corrects.includes(j)) $('o'+j).classList.add('good'); });
    $('valider').style.display='none';
    fin(S.essais===0 && !S.indice ? 'ok1':'ok2', true);
  } else if(S.essais === 0){
    S.essais++;
    const justes = S.multi.filter(k=>q.corrects.includes(k)).length;
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">Pas encore</div>
      <p>Tu as coché ${S.multi.length} proposition(s), dont ${justes} correcte(s) sur ${q.corrects.length}. ${q.socratique||''}</p></div>`;
  } else {
    q.options.forEach((_,j)=>{ $('o'+j).disabled=true;
      if(q.corrects.includes(j)) $('o'+j).classList.add('good');
      else if(S.multi.includes(j)) $('o'+j).classList.add('bad'); });
    $('valider').style.display='none';
    fin('vu', false);
  }
}
function repOrdre(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  const bon = q.melange.map((_,i)=>i).sort((a,b)=>q.rang[a]-q.rang[b]).join(',');
  if(S.ordre.length < q.melange.length){
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">Ordre incomplet</div><p>Place toutes les étapes avant de vérifier.</p></div>`;
    return;
  }
  if(S.ordre.join(',') === bon){
    $('valider').style.display='none';
    fin(S.essais===0 && !S.indice ? 'ok1':'ok2', true);
  } else if(S.essais === 0){
    S.essais++;
    let justes = 0;
    S.ordre.forEach((idx,p)=>{ if(q.rang[idx] === p) justes++; });
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">Pas encore</div>
      <p>${justes} étape(s) sur ${q.melange.length} sont à la bonne place. ${q.socratique||''}</p>
      <p><button class="btn ghost sm" onclick="resetOrdre()">↺ Réessayer</button></p></div>`;
  } else {
    $('valider').style.display='none';
    const ordreBon = q.melange.map((m,i)=>[m,q.rang[i]]).sort((a,b)=>a[1]-b[1]).map((x,i)=>`${i+1}. ${x[0]}`);
    $('slots').innerHTML = ordreBon.map(t=>`<span class="slot">${t}</span>`).join('');
    fin('vu', false);
  }
}
function repSaisie(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  const v = $('rep').value;
  if(!v.trim()) return;
  const ok = q.reponses.some(r => normalise(r) === normalise(v));
  const presque = !ok && q.reponses.some(r => sansAccents(r) === sansAccents(v));
  if(ok){
    $('rep').disabled = true; $('valider').style.display='none';
    fin(S.essais===0 && !S.indice ? 'ok1':'ok2', true);
  } else if(S.essais === 0){
    S.essais++;
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">${presque?'Presque : il manque un accent ou un signe':'Pas encore'}</div>
      <p>${presque ? 'La forme est bonne, la graphie ne l’est pas tout à fait. Regarde les accents et les traits d’union.' : (q.socratique||'Relis l’énoncé et reprends la méthode du rappel.')}</p></div>`;
    $('rep').select();
  } else {
    $('rep').disabled = true; $('valider').style.display='none';
    fin('vu', false);
  }
}
function repNombre(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  let v = $('rep').value.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').trim();
  if(!v) return;
  let n;
  try{ n = Function('"use strict";return (' + v + ')')(); }catch(e){ n = NaN; }
  const tol = q.tolerance === undefined ? 0.02 : q.tolerance;
  const ok = isFinite(n) && Math.abs(n - q.reponse) <= tol;
  if(ok){
    $('rep').disabled = true; $('valider').style.display='none';
    fin(S.essais===0 && !S.indice ? 'ok1':'ok2', true);
  } else if(S.essais === 0){
    S.essais++;
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">Pas encore</div><p>${q.socratique||'Reprends le calcul étape par étape.'}</p></div>`;
    $('rep').select();
  } else {
    $('rep').disabled = true; $('valider').style.display='none';
    fin('vu', false);
  }
}
function repChasse(){
  const q = APP.niveaux[S.niv].questions[S.iq];
  const bon = q.fautes.slice().sort().join(',');
  const mien = S.flags.slice().sort().join(',');
  if(mien === bon){
    $('valider').style.display='none';
    q.fautes.forEach(k=>{ const t=$('t'+k); t.classList.remove('flag'); t.classList.add('ok'); t.onclick=null; });
    fin(S.essais===0 && !S.indice ? 'ok1':'ok2', true);
  } else if(S.essais === 0){
    S.essais++;
    const trouves = S.flags.filter(k=>q.fautes.includes(k)).length;
    const faux = S.flags.filter(k=>!q.fautes.includes(k)).length;
    $('fb').innerHTML = `<div class="fb warn"><div class="ttl">Pas encore</div>
      <p>Ce passage contient ${q.fautes.length} faute(s). Tu en as trouvé ${trouves}${faux?`, et tu as marqué ${faux} mot(s) qui sont corrects`:''}. ${q.socratique||''}</p></div>`;
  } else {
    $('valider').style.display='none';
    q.fautes.forEach(k=>{ const t=$('t'+k); t.classList.remove('flag'); t.classList.add(S.flags.includes(k)?'ok':'miss'); });
    S.flags.filter(k=>!q.fautes.includes(k)).forEach(k=>{ $('t'+k).classList.remove('flag'); });
    document.querySelectorAll('.tok').forEach(t=>t.onclick=null);
    fin('vu', false);
  }
}

/* ---------- Fin de question : feedback + bouton suivant ---------- */
function fin(statut, juste){
  const q = APP.niveaux[S.niv].questions[S.iq];
  S.res[S.niv].statuts[S.iq] = statut;
  S.streak = statut === 'ok1' ? S.streak + 1 : 0;
  const cls = statut==='ok1' ? 'good' : statut==='ok2' ? 'warn' : 'bad';
  const ttl = statut==='ok1' ? '✅ Exact' : statut==='ok2' ? '🔄 Corrigé' : '👁 Réponse montrée';
  const sol = (!juste && q.solution) ? `<p><b>Réponse :</b> ${q.solution}</p>` : '';
  const dernier = S.iq === nbQ(S.niv) - 1;
  $('fb').innerHTML = `<div class="fb ${cls}"><div class="ttl">${ttl}</div>${sol}<p>${q.explication}</p></div>
    <button class="btn wide" onclick="${dernier?'bilanNiveau()':'suivante()'}">${dernier?'Voir le bilan du niveau ➜':'Question suivante ➜'}</button>`;
  const b = $('btnIndice'); if(b) b.style.display='none';
  majHeader();
}
function suivante(){ S.iq++; question(); }

/* ============================================================
   Bilans
   ============================================================ */
function compte(st){ return { ok1:st.filter(s=>s==='ok1').length, ok2:st.filter(s=>s==='ok2').length, vu:st.filter(s=>s==='vu').length }; }
function medaille(p){ return p>=90?'🏆':p>=70?'🥇':p>=50?'🥈':'🥉'; }
function grade(p){ return p>=85?['A','Excellent']:p>=65?['B','Très bien']:p>=45?['C','Satisfaisant']:['D','À retravailler']; }
function legende(){
  return `<div class="legend">
    <span><span class="dot" style="background:var(--success)"></span>Juste du 1er coup</span>
    <span><span class="dot" style="background:var(--orange)"></span>Trouvé après indice ou 2e essai</span>
    <span><span class="dot" style="background:var(--error)"></span>Réponse montrée</span></div>`;
}
function confettis(){
  const cols=['#34d399','#f59e0b','#60a5fa','#f472b6','#a78bfa'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.2+Math.random()*1.8)+'s';
    d.style.animationDelay=(Math.random()*.9)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),5200);
  }
}
function bilanNiveau(){
  const st = S.res[S.niv].statuts, c = compte(st), n = st.length;
  const p = Math.round(c.ok1/n*100);
  const [g,lib] = grade(p);
  const pred = S.pred[S.niv];
  const ecart = pred===undefined ? '' :
    `<p>Tu prédisais <b>${pred}/${n}</b> et tu en as réussi <b>${c.ok1}/${n}</b> du premier coup. ${
      pred===c.ok1 ? 'Tu te connais bien : c’est exactement ça.' :
      pred>c.ok1 ? 'Tu te croyais plus solide que tu ne l’es sur ce point — c’est justement là qu’il faut retourner.' :
      'Tu te sous-estimes : tu sais plus de choses que tu ne le crois.'}</p>`;
  const ouvert = p >= 80;
  if(ouvert && S.niv === S.debloque && S.debloque < APP.niveaux.length-1) S.debloque = S.niv+1;
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">BILAN DU NIVEAU ${S.niv+1}</div>
    <h2>${APP.niveaux[S.niv].titre}</h2>
    ${legende()}
    <table>
      <tr><th>Résultat</th><th>Nombre</th></tr>
      <tr><td>✅ Juste du 1er coup</td><td class="mono">${c.ok1}</td></tr>
      <tr><td>🔄 Corrigé au 2e essai / avec indice</td><td class="mono">${c.ok2}</td></tr>
      <tr><td>👁 Réponse montrée</td><td class="mono">${c.vu}</td></tr>
      <tr><th>Total</th><th class="mono">${n}</th></tr>
    </table>
    <div class="medal">${medaille(p)}</div>
    <div class="grade">${g} — ${lib} · ${p} % du 1er coup</div>
    ${ecart}
    <p>${ouvert ? 'Le niveau suivant est ouvert.' : 'Il te manque 80 % de réussite du premier coup pour ouvrir la suite. Refaire le niveau maintenant est le meilleur usage de ton temps : tu retiendras les questions ratées.'}</p>
    <div class="row">
      <button class="btn" onclick="ouvrirNiveau(${S.niv})">🔄 Refaire ce niveau</button>
      ${ouvert && S.niv < APP.niveaux.length-1 ? `<button class="btn" onclick="ouvrirNiveau(${S.niv+1})">Niveau suivant ➜</button>` : ''}
      ${!ouvert && S.niv < APP.niveaux.length-1 ? `<button class="btn ghost" onclick="forcer()">Continuer quand même</button>` : ''}
      <button class="btn ghost" onclick="hub()">Tous les niveaux</button>
      ${S.niv === APP.niveaux.length-1 ? `<button class="btn" onclick="bilanFinal()">🏁 Bilan complet</button>` : ''}
    </div>
  </div>`;
  if(p>=70) confettis();
  majHeader();
  window.scrollTo(0,0);
}
function forcer(){ if(S.debloque === S.niv) S.debloque = S.niv+1; ouvrirNiveau(S.niv+1); }

function bilanFinal(){
  let ok1=0, ok2=0, vu=0, tot=0, lignes='';
  APP.niveaux.forEach((n,i)=>{
    const st = S.res[i] ? S.res[i].statuts.filter(Boolean) : [];
    const c = compte(st);
    ok1+=c.ok1; ok2+=c.ok2; vu+=c.vu; tot+=st.length;
    lignes += `<tr><td>${n.titre}</td><td class="mono">${c.ok1}</td><td class="mono">${c.ok2}</td><td class="mono">${c.vu}</td><td class="mono">${st.length}</td></tr>`;
  });
  const p = tot? Math.round(ok1/tot*100):0;
  const [g,lib] = grade(p);
  const faibles = APP.niveaux.map((n,i)=>{
    const st = S.res[i] ? S.res[i].statuts.filter(Boolean) : [];
    if(!st.length) return null;
    const pc = st.filter(s=>s==='ok1').length/st.length*100;
    return pc < 65 ? n.titre : null;
  }).filter(Boolean);
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">BILAN COMPLET</div>
    <h1>${APP.titre}</h1>
    ${legende()}
    <table>
      <tr><th>Niveau</th><th>✅</th><th>🔄</th><th>👁</th><th>Total</th></tr>
      ${lignes}
      <tr><th>Ensemble</th><th class="mono">${ok1}</th><th class="mono">${ok2}</th><th class="mono">${vu}</th><th class="mono">${tot}</th></tr>
    </table>
    <div class="medal">${medaille(p)}</div>
    <div class="grade">${g} — ${lib} · ${p} % du 1er coup</div>
    ${faibles.length ? `<p><b>À revoir en priorité :</b> ${faibles.join(', ')}. Refais ces niveaux demain plutôt qu'aujourd'hui : revenir après une nuit fixe beaucoup mieux les choses.</p>`
      : `<p>Aucun niveau sous les 65 %. Refais l'ensemble dans deux jours pour vérifier que ça tient dans la durée.</p>`}
    <div class="row">
      <button class="btn" onclick="hub()">Retour aux niveaux</button>
      <button class="btn ghost" onclick="memo()">📄 Fiche mémo</button>
      <button class="btn ghost" onclick="location.reload()">🔄 Tout recommencer</button>
    </div>
  </div>`;
  if(p>=70) confettis();
  majHeader();
  window.scrollTo(0,0);
}

/* ============================================================
   Fiche mémo & atelier
   ============================================================ */
function memo(){
  app.innerHTML = `<div class="card"><div class="eyebrow">FICHE MÉMO</div><h2>${APP.titre}</h2>${APP.memo}
    <div class="row"><button class="btn" onclick="hub()">← Retour aux niveaux</button>
    <button class="btn ghost" onclick="window.print()">🖨️ Imprimer</button></div></div>`;
  window.scrollTo(0,0);
}
function atelier(){
  const a = APP.atelier;
  app.innerHTML = `<div class="card"><div class="eyebrow">ATELIER LIBRE — NON NOTÉ</div><h2>${a.titre}</h2>
    ${a.consigne}
    <div id="zoneAtelier"></div>
    <div class="row"><button class="btn ghost" onclick="hub()">← Retour aux niveaux</button></div></div>`;
  a.monter();
  window.scrollTo(0,0);
}

accueil();
</script>
</body>
</html>
